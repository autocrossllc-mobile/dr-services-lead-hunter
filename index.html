<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&R Property Leads Dashboard</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .title-group h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .title-group p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-refresh {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background: #2d3748;
        }

        .leads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .lead-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .lead-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .service-type {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .est-job {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-green);
            background: rgba(34, 197, 94, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
        }

        .request-details {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 1rem;
            word-break: break-word;
        }

        .meta-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.75rem;
            border-top: 1px solid var(--card-border);
        }

        .status-pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            background: #334155;
            color: #cbd5e1;
        }

        .btn-delete {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.4rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-delete:hover {
            background: var(--accent-red);
            color: #ffffff;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 0.75rem;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-group">
                <h1>D&R Lead Operations Dashboard</h1>
                <p>Live San Bernardino Parcel & Abatement Records</p>
            </div>
            <div class="actions">
                <span id="lead-count" class="badge">0 Leads Loaded</span>
                <button class="btn-refresh" onclick="loadLeads()">🔄 Refresh</button>
            </div>
        </header>

        <main id="leads-container" class="leads-grid">
            <div class="loading">Fetching verified leads from database...</div>
        </main>
    </div>

    <script>
        // Supabase Client Initialization
        const SUPABASE_URL = "https://grccpxhtwgctgwtjtejz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DSgli-s1kPh0zA4E-kT64A_6LiMrWg-";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fetch & Render Leads
        async function loadLeads() {
            const container = document.getElementById('leads-container');
            container.innerHTML = '<div class="loading">Fetching verified leads from database...</div>';

            try {
                const { data: leads, error } = await supabaseClient
                    .from('leads')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                document.getElementById('lead-count').innerText = `${leads.length} Leads Total`;

                if (!leads || leads.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>No Active Leads Found</h2>
                            <p>Run your hunter.py pipeline to pull new parcel records.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                leads.forEach(lead => {
                    const card = document.createElement('div');
                    card.className = 'lead-card';
                    card.id = `lead-${lead.id}`;

                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span class="service-type">${escapeHtml(lead.service || 'Property Lead')}</span>
                                <span class="est-job">${escapeHtml(lead.estimated_job || '$1,500 Est.')}</span>
                            </div>
                            <div class="request-details">
                                ${escapeHtml(lead.request || 'No details provided.')}
                            </div>
                            <div class="meta-info">
                                <span>📍 <strong>Location:</strong> ${escapeHtml(lead.location || 'Inland Empire')}</span>
                                <span>👤 <strong>Record:</strong> ${escapeHtml(lead.customer || 'County Record')}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span class="status-pill">${escapeHtml(lead.status || 'Active')}</span>
                            <button class="btn-delete" onclick="deleteLead('${lead.id}')">
                                🗑️ Delete
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<div class="empty-state" style="color: var(--accent-red);">Error loading leads: ${err.message}</div>`;
            }
        }

        // Delete Lead Function
        async function deleteLead(leadId) {
            if (!confirm("Are you sure you want to permanently delete this lead?")) {
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('leads')
                    .delete()
                    .eq('id', leadId);

                if (error) {
                    alert("Failed to delete lead: " + error.message);
                    return;
                }

                // Remove element from UI instantly
                const cardElement = document.getElementById(`lead-${leadId}`);
                if (cardElement) {
                    cardElement.remove();
                }

                // Update counter
                const currentCountElem = document.getElementById('lead-count');
                const currentCount = parseInt(currentCountElem.innerText) || 1;
                const newCount = Math.max(0, currentCount - 1);
                currentCountElem.innerText = `${newCount} Leads Total`;

                if (newCount === 0) {
                    document.getElementById('leads-container').innerHTML = `
                        <div class="empty-state">
                            <h2>No Active Leads Found</h2>
                            <p>Run your hunter.py pipeline to pull new parcel records.</p>
                        </div>
                    `;
                }

            } catch (err) {
                alert("Delete Error: " + err.message);
            }
        }

        // Helper to prevent XSS
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Auto-load leads on page load
        window.addEventListener('DOMContentLoaded', loadLeads);
    </script>
</body>
</html>
