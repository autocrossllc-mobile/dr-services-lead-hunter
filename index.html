<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCross & Lawn Prospect Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #212529;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2e7d32;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 20px;
      color: #2e7d32;
      margin: 0;
    }

    .date-badge {
      background: #e8f5e9;
      color: #1b5e20;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: bold;
    }

    /* Tabs Styling */
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      border-bottom: 1px solid #dee2e6;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-color: #e9ecef;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      color: #495057;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #2e7d32;
      color: white;
    }

    /* Controls & Search */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 260px;
      padding: 10px 14px;
      font-size: 14px;
      border: 2px solid #2e7d32;
      border-radius: 6px;
      outline: none;
    }

    .btn-route {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-route:hover {
      background-color: #1b5e20;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }

    th, td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid #dee2e6;
      font-size: 14px;
    }

    th {
      background-color: #f1f3f5;
      color: #495057;
      font-weight: bold;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .stop-num {
      font-weight: bold;
      color: #2e7d32;
      width: 50px;
    }

    .tag-service {
      display: inline-block;
      padding: 2px 8px;
      background: #f0f4f8;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #334e68;
    }

    .nav-btn {
      color: #1a73e8;
      text-decoration: none;
      font-weight: bold;
    }

    .nav-btn:hover {
      text-decoration: underline;
    }

    .meta-status {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>🎯 Lead Manager & Route Navigator</h1>
        <p style="font-size: 13px; color: #6c757d; margin-top: 4px;">Categorized leads with automated daily route planning</p>
      </div>
      <span class="date-badge" id="current-date">Today's Date</span>
    </div>

    <!-- TABS NAVIGATION -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('daily-route', event)">🚗 Today's Auto-Route</button>
      <button class="tab-btn" onclick="switchTab('lawn-prospects', event)">🌱 Lawn Prospects</button>
      <button class="tab-btn" onclick="switchTab('service-leads', event)">🔧 Other / Service Leads</button>
      <button class="tab-btn" onclick="switchTab('all-leads', event)">📋 Master Database</button>
    </div>

    <!-- TOOLBAR (Search + Route Launch) -->
    <div class="toolbar">
      <input 
        type="text" 
        id="search-bar" 
        class="search-input" 
        placeholder="🔍 Search current tab by street, owner name, service, or phone..." 
      />
      <button class="btn-route" id="launch-maps-btn">🗺️ Open Multi-Stop Route</button>
    </div>

    <div class="meta-status" id="tab-status">Loading leads...</div>

    <!-- TABLE -->
    <table>
      <thead>
        <tr id="table-head">
          <th class="stop-num">Stop</th>
          <th>Property / Address</th>
          <th>Contact Name</th>
          <th>Phone Number</th>
          <th>Category / Service</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td colspan="6">Loading database records...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "https://grccpxhtwgctgwtjtejz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DSgli-s1kPh0zA4E-kT64A_6LiMrWg-";

    let allLeads = [];
    let currentTab = 'daily-route';

    // Display formatted current date
    const today = new Date();
    document.getElementById("current-date").innerText = `📅 ${today.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`;

    function parseAddress(addrStr) {
      if (!addrStr) return ['', 0];
      const match = addrStr.trim().match(/^(\d+)\s+(.+)/);
      return match ? [match[2].toLowerCase(), parseInt(match[1], 10)] : [addrStr.toLowerCase(), 0];
    }

    async function loadData() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/leads?select=*&order=created_at.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        allLeads = await response.json();
        renderTab();
      } catch (err) {
        document.getElementById("table-body").innerHTML = `<tr><td colspan="6" style="color:red;">Error loading leads: ${err.message}</td></tr>`;
      }
    }

    function switchTab(tabId, event) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById("search-bar").value = "";
      renderTab();
    }

    function renderTab() {
      const query = document.getElementById("search-bar").value.toLowerCase().trim();
      const tbody = document.getElementById("table-body");
      const statusText = document.getElementById("tab-status");

      let filtered = [];

      // 1. FILTER BY TAB CATEGORY
      if (currentTab === 'daily-route') {
        // Automatically selects active Lawn Prospects and generates a daily street-by-street batch
        const lawnLeads = allLeads.filter(l => (l.service || '').toLowerCase().includes('lawn care'));
        
        // Deterministic daily rotation seed using day of year
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const batchSize = 10;
        const startIndex = (dayOfYear * batchSize) % (lawnLeads.length || 1);
        
        // Take today's slice or fallback to all lawn leads if small dataset
        let todaysBatch = lawnLeads.slice(startIndex, startIndex + batchSize);
        if (todaysBatch.length < 5) todaysBatch = lawnLeads.slice(0, batchSize);

        // Sort street-by-street for driving efficiency
        todaysBatch.sort((a, b) => {
          const [streetA, numA] = parseAddress(a.request);
          const [streetB, numB] = parseAddress(b.request);
          return streetA.localeCompare(streetB) || (numA - numB);
        });

        filtered = todaysBatch;

      } else if (currentTab === 'lawn-prospects') {
        filtered = allLeads.filter(l => (l.service || '').toLowerCase().includes('lawn care'));
      } else if (currentTab === 'service-leads') {
        filtered = allLeads.filter(l => !(l.service || '').toLowerCase().includes('lawn care'));
      } else {
        filtered = [...allLeads];
      }

      // 2. APPLY SEARCH QUERY FILTER
      if (query) {
        filtered = filtered.filter(l => {
          const addr = (l.request || "").toLowerCase();
          const name = (l.customer || "").toLowerCase();
          const phone = (l.mobile_phones || "").toLowerCase();
          const srv = (l.service || "").toLowerCase();
          return addr.includes(query) || name.includes(query) || phone.includes(query) || srv.includes(query);
        });
      }

      // 3. RENDER TABLE
      tbody.innerHTML = "";
      const routeAddresses = [];

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">No leads found for this view.</td></tr>';
        statusText.innerText = `0 items in view.`;
        return;
      }

      const tabNames = {
        'daily-route': '🚗 Today\'s Auto-Generated Route (Street-Ordered)',
        'lawn-prospects': '🌱 All Lawn Care Prospects',
        'service-leads': '🔧 Other / General Service Requests',
        'all-leads': '📋 All Master Database Records'
      };

      statusText.innerText = `${tabNames[currentTab]} — Showing ${filtered.length} entries.`;

      filtered.forEach((lead, idx) => {
        const addr = lead.request || "N/A";
        if (addr !== "N/A") routeAddresses.push(addr);

        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="stop-num">#${idx + 1}</td>
          <td><strong>${addr}</strong></td>
          <td>${lead.customer || 'Current Owner'}</td>
          <td>${lead.mobile_phones || '—'}</td>
          <td><span class="tag-service">${lead.service || 'General Inquiry'}</span></td>
          <td>
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" class="nav-btn">
              📍 Navigate
            </a>
          </td>
        `;
        tbody.appendChild(row);
      });

      // Update multi-stop navigation link for active items
      document.getElementById("launch-maps-btn").onclick = () => {
        if (routeAddresses.length > 0) {
          const stops = routeAddresses.slice(0, 10).map(a => encodeURIComponent(a)).join("/");
          window.open(`https://www.google.com/maps/dir/${stops}`, "_blank");
        } else {
          alert("No addresses available in current view.");
        }
      };
    }

    // Attach search listener
    document.getElementById("search-bar").addEventListener("input", renderTab);

    // Initial load
    loadData();
  </script>
</body>
</html>
