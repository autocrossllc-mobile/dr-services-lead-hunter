<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&R Services Lead Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 font-sans">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-black tracking-wider text-amber-400">D&R SERVICES</h1>
                <p class="text-xs text-slate-400 tracking-widest">LOT, JUNK & ABATEMENT HUNTER</p>
            </div>
            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">
                LIVE
            </span>
        </header>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-400 uppercase">🔥 High-Ticket Targets</p>
                <p id="hot-count" class="text-3xl font-bold text-amber-400 mt-1">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-400 uppercase">🌱 Total Leads</p>
                <p id="total-count" class="text-3xl font-bold text-emerald-400 mt-1">0</p>
            </div>
        </div>

        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Incoming Target Queue</h2>
        <div id="leads-list" class="space-y-3">
            <p class="text-slate-500 text-sm">Scanning target zones...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://grccpxhtwgctgwtjtejz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DSgli-s1kPh0zA4E-kT64A_6LiMrWg-';
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadDashboard() {
            const { data: leads, error } = await db
                .from('leads')
                .select('*')
                .order('score', { ascending: false });

            const listEl = document.getElementById('leads-list');
            
            if (error) {
                listEl.innerHTML = `<p class="text-red-400 text-sm">Error loading leads: ${error.message}</p>`;
                return;
            }

            if (!leads || leads.length === 0) {
                listEl.innerHTML = `<p class="text-slate-500 text-sm">No active targets in database.</p>`;
                document.getElementById('hot-count').innerText = '0';
                document.getElementById('total-count').innerText = '0';
                return;
            }

            // Expanded filter: Lot cleanups, junk removal, hauling, estate cleanouts, abatements, brush, weed
            const isPriority = (l) => {
                const text = ((l.service || '') + ' ' + (l.request || '')).toLowerCase();
                return /lot|cleanup|abatement|junk|hauling|debris|cleanout|estate|brush|weed|overgrown|yard|acre/.test(text);
            };

            document.getElementById('hot-count').innerText = leads.filter(isPriority).length;
            document.getElementById('total-count').innerText = leads.length;

            listEl.innerHTML = leads.map(lead => `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl relative">
                    <div class="flex justify-between items-start mb-2">
                        <span class="bg-amber-950 text-amber-400 border border-amber-800 text-xs px-2 py-0.5 rounded font-bold">🔥 Score: ${lead.score}</span>
                        <span class="text-xs text-slate-400">${lead.location || 'Local'}</span>
                    </div>
                    <h3 class="font-bold text-white text-base">${lead.service}</h3>
                    <p class="text-sm text-slate-300 mt-1">${lead.request}</p>
                    <p class="text-xs text-amber-300/80 mt-2"><strong>Contact / Owner:</strong> ${lead.customer || 'Unassigned / Public Listing'}</p>
                    <div class="mt-3 pt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                        <span>Est: <strong class="text-emerald-400">${lead.estimated_job || 'TBD'}</strong></span>
                        <div class="space-x-1">
                            <button onclick="callLead('${lead.customer || ''}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg font-bold">Contact</button>
                            <button onclick="deleteLead('${lead.id}')" class="bg-rose-950 hover:bg-rose-900 text-rose-400 border border-rose-800 px-2 py-1.5 rounded-lg font-semibold">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function deleteLead(id) {
            if (!confirm('Permanently delete this lead and scrub its data?')) return;
            const { error } = await db.from('leads').delete().eq('id', id);
            if (error) {
                alert('Error deleting lead: ' + error.message);
            } else {
                loadDashboard();
            }
        }

        function callLead(name) {
            alert(`Initiating direct outreach script for ${name}. Opening dialer...`);
        }

        loadDashboard();
    </script>
</body>
</html>
