<!DOCTYPE html>
<html>
<head>
    <title>Leads</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 20px;">

<h2>Leads</h2>
<div id="leads-list">Loading...</div>

<script>
    const supabaseClient = supabase.createClient("https://grccpxhtwgctgwtjtejz.supabase.co", "sb_publishable_DSgli-s1kPh0zA4E-kT64A_6LiMrWg-");

    async function loadLeads() {
        const { data, error } = await supabaseClient.from('leads').select('*').order('id', { ascending: false });
        const container = document.getElementById('leads-list');
        
        if (error || !data || data.length === 0) {
            container.innerHTML = "No leads found.";
            return;
        }

        let html = '<ul style="list-style-type: none; padding: 0;">';
        data.forEach(lead => {
            let phone = "N/A";
            if (lead.request && lead.request.includes("Phone:")) {
                phone = lead.request.split("Phone:")[1].split("|")[0].trim();
            }
            let name = lead.customer ? lead.customer.split("(")[0].trim() : "Direct Lead";

            html += `
                <li style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
                    <b>${lead.service || 'Service'}</b> (${lead.estimated_job || 'N/A'}) 
                    <button onclick="toggleInfo(this)" style="margin-left: 10px; cursor: pointer;">Contact</button>
                    <div class="info" style="display: none; margin-top: 5px; padding-left: 10px;">
                        Name: ${name}<br>
                        Phone: ${phone}<br>
                        Address: ${lead.location || 'Inland Empire, CA'}
                    </div>
                </li>
            `;
        });
        html += '</ul>';
        container.innerHTML = html;
    }

    function toggleInfo(btn) {
        const infoDiv = btn.nextElementSibling;
        infoDiv.style.display = infoDiv.style.display === 'none' ? 'block' : 'none';
    }

    loadLeads();
</script>

</body>
</html>
