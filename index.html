<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enriched Lawn Prospect & Scout Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 12px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .header { background: #1e1e1e; padding: 16px; border-radius: 8px; border-bottom: 3px solid #2e7d32; margin-bottom: 12px; }
    h1 { font-size: 18px; color: #4caf50; margin: 0 0 4px 0; }
    .subtext { font-size: 12px; color: #aaa; }

    .batch-controls { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #333; }
    .batch-btn { background: #2a2a2a; color: #4caf50; border: 1px solid #4caf50; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .batch-btn:disabled { color: #555; border-color: #333; cursor: not-allowed; }
    .batch-status { font-size: 13px; font-weight: bold; color: #fff; }

    .route-btn { display: block; width: 100%; background: #2e7d32; color: white; text-align: center; padding: 14px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 15px; margin-bottom: 12px; border: none; cursor: pointer; }
    .search-bar { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }

    .street-header { background: #2a2a2a; padding: 8px 12px; font-size: 13px; font-weight: bold; color: #4caf50; border-radius: 4px; margin: 12px 0 6px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .list-item { background: #1e1e1e; border-bottom: 1px solid #2a2a2a; padding: 14px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    
    .item-left { flex: 1; min-width: 260px; }
    .item-stop { color: #4caf50; font-weight: bold; font-size: 12px; }
    .item-address { font-size: 16px; font-weight: bold; color: #fff; margin: 3px 0; }
    .item-meta { font-size: 13px; color: #aaa; margin-top: 2px; }

    .badge-absentee { background: #b71c1c; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; margin-left: 6px; }
    .badge-owner { background: #1b5e20; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; margin-left: 6px; }

    .action-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn { padding: 8px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px; color: white; white-space: nowrap; }
    .btn-nav { background: #1565c0; }
    .btn-streetview { background: #e65100; }
    .btn-search { background: #4a148c; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌱 Enriched Lawn Prospect & Scout Dashboard</h1>
    <div class="subtext" id="sync-status">Loading target database...</div>
  </div>

  <input type="text" id="search-input" class="search-bar" placeholder="🔍 Filter active houses by street, owner, or phone..." oninput="resetAndRender()">

  <div class="batch-controls">
    <button class="batch-btn" id="prev-btn" onclick="changeBatch(-1)">⬅️ Prev 20</button>
    <span class="batch-status" id="batch-indicator">Showing 1 - 20</span>
    <button class="batch-btn" id="next-btn" onclick="changeBatch(1)">Next 20 ➡️</button>
  </div>

  <button class="route-btn" id="maps-multi-btn">🗺️ Route Current 20 Houses in Google Maps</button>

  <div id="list-container"></div>
</div>

<script>
  const SUPABASE_URL = "https://grccpxhtwgctgwtjtejz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_DSgli-s1kPh0zA4E-kT64A_6LiMrWg-";
  
  let dataset = [];
  let currentBatchIndex = 0;
  const BATCH_SIZE = 20;

  function parseAddress(str) {
    const match = (str || '').trim().match(/^(\d+)\s+(.+)/);
    return match ? [match[2].toLowerCase(), parseInt(match[1], 10)] : [str.toLowerCase(), 0];
  }

  async function loadData() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?select=*&order=created_at.desc`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      dataset = await res.json();
      document.getElementById("sync-status").innerText = `Active Database: ${dataset.length} property targets.`;
      render();
    } catch (err) {
      document.getElementById("sync-status").innerText = "Connection error. Check Supabase database.";
    }
  }

  function changeBatch(direction) {
    currentBatchIndex += direction;
    render();
  }

  function resetAndRender() {
    currentBatchIndex = 0;
    render();
  }

  function render() {
    const query = document.getElementById("search-input").value.toLowerCase();
    const container = document.getElementById("list-container");
    
    let items = dataset.filter(i => (i.service || '').toLowerCase().includes('lawn'));
    
    if (query) {
      items = items.filter(i => 
        (i.request || '').toLowerCase().includes(query) ||
        (i.customer || '').toLowerCase().includes(query) ||
        (i.mobile_phones || '').toLowerCase().includes(query)
      );
    }

    items.sort((a, b) => {
      const [streetA, numA] = parseAddress(a.request);
      const [streetB, numB] = parseAddress(b.request);
      return streetA.localeCompare(streetB) || (numA - numB);
    });

    const totalItems = items.length;
    const maxBatch = Math.max(0, Math.ceil(totalItems / BATCH_SIZE) - 1);
    currentBatchIndex = Math.max(0, Math.min(currentBatchIndex, maxBatch));

    const start = currentBatchIndex * BATCH_SIZE;
    const end = Math.min(start + BATCH_SIZE, totalItems);
    const activeBatch = items.slice(start, end);

    document.getElementById("batch-indicator").innerText = totalItems > 0 
      ? `Showing ${start + 1} - ${end} of ${totalItems}` 
      : "0 Houses Found";
      
    document.getElementById("prev-btn").disabled = (currentBatchIndex === 0);
    document.getElementById("next-btn").disabled = (end >= totalItems);

    container.innerHTML = "";
    const navAddresses = [];
    let currentStreetGroup = "";

    activeBatch.forEach((item, idx) => {
      const addr = item.request || 'Address N/A';
      if (addr !== 'Address N/A') navAddresses.push(addr);

      const [streetName] = parseAddress(addr);
      const ownerName = item.customer || 'Current Owner';
      const serviceInfo = item.service || '';
      const isAbsentee = serviceInfo.includes('Absentee');

      if (streetName !== currentStreetGroup) {
        currentStreetGroup = streetName;
        const streetHeader = document.createElement("div");
        streetHeader.className = "street-header";
        streetHeader.innerText = `🛣️ ${streetName.toUpperCase()}`;
        container.appendChild(streetHeader);
      }

      // Pre-filled 1-click skip-trace search link
      const skipTraceUrl = `https://www.truepeoplesearch.com/results?name=${encodeURIComponent(ownerName)}&citystatezip=${encodeURIComponent(item.location || 'San Bernardino, CA')}`;
      const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=34.1083,-117.2898&query=${encodeURIComponent(addr)}`;

      const itemRow = document.createElement("div");
      itemRow.className = "list-item";
      itemRow.innerHTML = `
        <div class="item-left">
          <div class="item-stop">STOP #${start + idx + 1} ${isAbsentee ? '<span class="badge-absentee">🚨 ABSENTEE LANDLORD</span>' : '<span class="badge-owner">🏠 OWNER OCCUPIED</span>'}</div>
          <div class="item-address">${addr}</div>
          <div class="item-meta">👤 <strong>${ownerName}</strong> | 📱 ${item.mobile_phones || 'No phone on file'}</div>
        </div>
        <div class="action-group">
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" class="action-btn btn-nav">📍 NAV</a>
          <a href="${streetViewUrl}" target="_blank" class="action-btn btn-streetview">📸 Street View</a>
          <a href="${skipTraceUrl}" target="_blank" class="action-btn btn-search">🔎 Find Phone</a>
        </div>
      `;
      container.appendChild(itemRow);
    });

    document.getElementById("maps-multi-btn").onclick = () => {
      if (navAddresses.length) {
        const stopsUrl = "https://www.google.com/maps/dir/" + navAddresses.slice(0, 10).map(a => encodeURIComponent(a)).join("/");
        window.open(stopsUrl, "_blank");
      } else {
        alert("No valid addresses available in this batch.");
      }
    };
  }

  loadData();
</script>
</body>
</html>
