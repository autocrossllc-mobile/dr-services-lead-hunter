<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&R Lead Dispatch & Property Lookup Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #131c2e;
            --border-color: #1e2d4a;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding: 1.5rem; min-height: 100vh; }
        .container { max-width: 1350px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; gap: 1rem;
        }

        .header-title h1 { font-size: 1.75rem; font-weight: 700; color: #fff; }
        .header-title p { color: var(--text-sub); font-size: 0.875rem; margin-top: 0.25rem; }

        .filter-bar {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--panel-bg); color: var(--text-sub); border: 1px solid var(--border-color);
            padding: 0.45rem 0.9rem; border-radius: 0.5rem; font-size: 0.825rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(56, 189, 248, 0.08); }

        .counter-badge {
            background: rgba(56, 189, 248, 0.1); color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 0.4rem 0.8rem; border-radius: 9999px;
            font-weight: 600; font-size: 0.85rem;
        }

        .btn {
            background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--border-color);
            padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 0.85rem;
        }

        .leads-list { display: flex; flex-direction: column; gap: 0.85rem; }

        .lead-card {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 0.75rem; padding: 1.25rem; display: grid;
            grid-template-columns: 2.2fr 1.8fr 1fr 1fr; gap: 1rem; align-items: center;
        }

        .col-main h3 { font-size: 1.05rem; color: #fff; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.5rem; }
        .col-main p { color: var(--text-sub); font-size: 0.825rem; }

        .badge-pill {
            padding: 0.15rem 0.5rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
        }
        .bg-res { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
        .bg-comm { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border: 1px solid rgba(168, 85, 247, 0.3); }
        .bg-abatement { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .bg-absentee { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); }
        .bg-tax { background: rgba(249, 115, 22, 0.15); color: var(--accent-orange); border: 1px solid rgba(249, 115, 22, 0.3); }

        .col-details { font-size: 0.825rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .col-details strong { color: #fff; }

        .col-est { font-size: 1.05rem; font-weight: 700; color: var(--accent-green); }

        .col-actions { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }

        .btn-delete {
            background: transparent; color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.3rem 0.6rem; border-radius: 0.375rem; font-size: 0.725rem; font-weight: 600; cursor: pointer;
        }
        .btn-delete:hover { background: var(--accent-red); color: #fff; }

        .loading, .empty { text-align: center; padding: 3rem; color: var(--text-sub); }

        @media (max-width: 900px) {
            .lead-card { grid-template-columns: 1fr; gap: 0.75rem; }
            .col-actions { flex-direction: row; justify-content: space-between; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <h1>D&R Property Leads & Dispatch Dashboard</h1>
                <p>Categorized by Residential, Commercial, Abatement Notices & Owner Record Types</p>
            </div>
            <div style="display: flex; gap: 0.75rem; align-items: center;">
                <span id="lead-count" class="counter-badge">0 Active Leads</span>
                <button class="btn" onclick="loadLeads()">🔄 Refresh</button>
            </div>
        </header>

        <!-- Service & Category Filter Tabs -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterLeads('ALL', this)">All Leads</button>
            <button class="filter-btn" onclick="filterLeads('Residential', this)">🏡 Homeowners (Residential)</button>
            <button class="filter-btn" onclick="filterLeads('Commercial', this)">🏢 Commercial Properties</button>
            <button class="filter-btn" onclick="filterLeads('Abatement', this)">🚨 Abatement & Fine Notices</button>
            <button class="filter-btn" onclick="filterLeads('Lawn', this)">🌱 Lawn Care & Yard Cleanups</button>
            <button class="filter-btn" onclick="filterLeads('Clearing', this)">🚜 Lot Clearing & Cleanups</button>
            <button class="filter-btn" onclick="filterLeads('Absentee', this)">🏠 Absentee Owners</button>
            <button class="filter-btn" onclick="filterLeads('Tax', this)">⚠️ Tax Delinquent</button>
        </div>

        <main id="leads-container" class="leads-list">
            <div class="loading">Loading lead database...</div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://grccpxhtwgctgwtjtejz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DSgli-s1kPh0zA4E-kT64A_6LiMrWg-";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLeads = [];

        async function loadLeads() {
            const container = document.getElementById('leads-container');
            container.innerHTML = '<div class="loading">Fetching latest property owner leads...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('leads')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;
                allLeads = data || [];
                renderLeads(allLeads);
            } catch (err) {
                container.innerHTML = `<div class="empty" style="color: var(--accent-red);">Error loading leads: ${err.message}</div>`;
            }
        }

        function renderLeads(leads) {
            const container = document.getElementById('leads-container');
            document.getElementById('lead-count').innerText = `${leads.length} Active Leads`;

            if (leads.length === 0) {
                container.innerHTML = '<div class="empty">No matching leads found for this filter.</div>';
                return;
            }

            container.innerHTML = '';
            leads.forEach(lead => {
                const parsed = parseLeadRequest(lead.request || '');
                let badgeClass = 'bg-absentee';
                if (parsed.propType === 'Commercial') badgeClass = 'bg-comm';
                else if (parsed.propType === 'Residential') badgeClass = 'bg-res';
                if (lead.service.includes('Abatement') || lead.service.includes('Code')) badgeClass = 'bg-abatement';
                if (lead.service.includes('Tax')) badgeClass = 'bg-tax';

                const card = document.createElement('div');
                card.className = 'lead-card';
                card.id = `lead-${lead.id}`;

                card.innerHTML = `
                    <div class="col-main">
                        <h3>📍 ${escapeHtml(parsed.address)} <span class="badge-pill ${badgeClass}">${escapeHtml(parsed.propType)} • ${escapeHtml(lead.service)}</span></h3>
                        <p>👤 Owner: <strong>${escapeHtml(parsed.owner)}</strong> | Location: ${escapeHtml(lead.location || 'San Bernardino, CA')}</p>
                    </div>
                    <div class="col-details">
                        <span>📞 Phone: <strong>${escapeHtml(parsed.phone)}</strong></span>
                        <span>✉️ Email: ${escapeHtml(parsed.email)}</span>
                        <span>🆔 APN: ${escapeHtml(parsed.apn)} (${escapeHtml(parsed.acres)} Acres)</span>
                    </div>
                    <div class="col-est">
                        ${escapeHtml(lead.estimated_job || '$1,800 - $5,500')}
                    </div>
                    <div class="col-actions">
                        <button class="btn-delete" onclick="deleteSingleLead('${lead.id}')">🗑️ Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function parseLeadRequest(str) {
            let apn = 'N/A', address = 'Property Parcel', owner = 'Property Owner', phone = 'N/A', email = 'N/A', acres = 'N/A', propType = 'Residential';
            str.split('|').forEach(part => {
                const clean = part.trim();
                if (clean.startsWith('APN:')) apn = clean.replace('APN:', '').trim();
                if (clean.startsWith('Address:')) address = clean.replace('Address:', '').trim();
                if (clean.startsWith('Owner:')) owner = clean.replace('Owner:', '').trim();
                if (clean.startsWith('Phone:')) phone = clean.replace('Phone:', '').trim();
                if (clean.startsWith('Email:')) email = clean.replace('Email:', '').trim();
                if (clean.startsWith('Acres:')) acres = clean.replace('Acres:', '').trim();
                if (clean.startsWith('PropType:')) propType = clean.replace('PropType:', '').trim();
            });
            return { apn, address, owner, phone, email, acres, propType };
        }

        function filterLeads(keyword, btnElem) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElem.classList.add('active');

            if (keyword === 'ALL') return renderLeads(allLeads);

            const filtered = allLeads.filter(l => {
                const text = (l.service + " " + l.request).toLowerCase();
                const key = keyword.toLowerCase();

                if (keyword === 'Commercial') return text.includes('proptype: commercial') || text.includes('commercial');
                if (keyword === 'Residential') return text.includes('proptype: residential') || (!text.includes('proptype: commercial') && !text.includes('commercial'));
                if (keyword === 'Abatement') return text.includes('abatement') || text.includes('code enforcement') || text.includes('notice');
                return text.includes(key);
            });

            renderLeads(filtered);
        }

        async function deleteSingleLead(id) {
            if (!confirm("Permanently delete this record?")) return;
            const { error } = await supabaseClient.from('leads').delete().eq('id', id);
            if (!error) {
                document.getElementById(`lead-${id}`)?.remove();
                allLeads = allLeads.filter(l => l.id != id);
                document.getElementById('lead-count').innerText = `${allLeads.length} Active Leads`;
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.addEventListener('DOMContentLoaded', loadLeads);
    </script>
</body>
</html>
